<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · DripFeed India</title>
    <meta name="theme-color" content="#111827" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020617, #111827 55%, #1d4ed8);
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(92vw, 420px);
        padding: 28px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 20px 60px rgba(2, 6, 23, 0.45);
        border: 1px solid rgba(255,255,255,0.12);
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 1.5rem; }
      p { margin: 0; line-height: 1.6; color: #cbd5e1; }
      .badge { display: inline-block; margin-top: 16px; padding: 8px 12px; border-radius: 999px; background: rgba(59, 130, 246, 0.18); color: #bfdbfe; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>DripFeed India is ready for a quick look even without a connection. Reconnect to browse the latest deals and compare products again.</p>
      <div class="badge">Installed app ready</div>
    </main>
  </body>
</html>
